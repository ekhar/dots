# Deliberate overrides of tmux defaults.
unbind C-b

bind C-x lock-server
bind C-c new-window -c '#{pane_current_path}'
bind C-d detach-client
bind H previous-window
bind L next-window
bind r command-prompt 'rename-window %%'
bind R source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'
bind C-a last-window
bind C-w list-windows
bind w list-windows
bind z resize-pane -Z
bind C-l refresh-client
bind | split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r , resize-pane -L 10
bind -r . resize-pane -R 10
bind -r - resize-pane -D 5
bind -r = resize-pane -U 5
bind : command-prompt
bind '*' set-window-option synchronize-panes
bind P set-option pane-border-status
bind X kill-pane
bind x swap-pane -D
bind S choose-tree -s
bind K send-keys C-l
bind C command-prompt -p 'new session:' 'new-session -s "%%"'
bind M command-prompt -p 'tmuxinator project:' 'run-shell "tmuxinator start %% >/dev/null 2>&1"'

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
